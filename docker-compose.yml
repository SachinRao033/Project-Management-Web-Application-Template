services:

  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - projectflow-network


  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

    ports:
      - "${BACKEND_PORT}:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - projectflow-network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      - backend

    networks:
      - projectflow-network


volumes:
  postgres_data:


networks:
  projectflow-network:
    driver: bridge
